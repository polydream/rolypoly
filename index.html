<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>
    <iframe 
        id="yt-player"
        src="" 
        title="YouTube video player" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
    </iframe>

    <script>
    function updatePlayerFromHash() {
        const iframe = document.getElementById('yt-player');
        const hash = window.location.hash;

        if (!hash.startsWith('#play/')) {
            return;
        }

        const rawParams = hash.replace('#play/', '');
        if (!rawParams) return;

        let videoId = rawParams;
        let startSeconds = 0;

        const separator = rawParams.includes('?') ? '?' : (rawParams.includes('&') ? '&' : null);
        if (separator) {
            const parts = rawParams.split(separator);
            videoId = parts[0];
            const searchParams = new URLSearchParams(parts[1]);
            if (searchParams.has('start')) {
                startSeconds = searchParams.get('start');
            }
        }

        const origin = encodeURIComponent(window.location.origin);
        let embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&enablejsapi=1&playsinline=1&origin=${origin}`;

        if (startSeconds) {
            embedUrl += `&start=${startSeconds}`;
        }

        iframe.src = embedUrl;
    }

    window.addEventListener('DOMContentLoaded', updatePlayerFromHash);
    window.addEventListener('hashchange', updatePlayerFromHash);
    </script>
</body>
</html>
